# TODO(verify): pin every action below to an exact SHA before first real
# use (supply-chain rule, spec section 3.10).
name: apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "requests/**"
      - "modules/**"

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      # Sorted so layer-ordered numeric prefixes (00-foundation,
      # 10-server, 20-databases, 30-access) apply L0 -> L1 -> L2 -> L3,
      # per spec section 16.1 — this relies entirely on the directory
      # naming convention; don't rename a layer directory to something
      # that breaks the sort.
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          STACKS=$(bash scripts/detect-changed-stacks.sh "origin/${{ github.event.before }}" | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "stacks=$STACKS" >> "$GITHUB_OUTPUT"

  # Policy (section 16.3): block delete/replace of protected resource types
  # unless the merged PR carried the break-glass label with two approvals.
  # CI re-checks this at apply time, not just at PR time, in case the base
  # branch moved between approval and merge.
  policy-gate:
    needs: detect
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build break-glass exceptions data document
        id: exceptions
        run: |
          # data.exceptions.break_glass is keyed by resource address. This
          # run treats a PR that merged with the `break-glass` label + 2
          # approvals as exempting every resource this push touches —
          # a coarser grant than per-address, but still fully audited via
          # the PR itself (see docs/runbooks/break-glass.md).
          mkdir -p /tmp/policy-data
          if [[ "${{ contains(github.event.head_commit.message, '[break-glass]') }}" == "true" ]]; then
            echo '{"exceptions":{"break_glass":{"*":true}}}' > /tmp/policy-data/exceptions.json
          else
            echo '{"exceptions":{"break_glass":{}}}' > /tmp/policy-data/exceptions.json
          fi

      - name: conftest against each changed stack's plan
        run: |
          for stack in $(echo '${{ needs.detect.outputs.stacks }}' | jq -r '.[]'); do
            terragrunt plan -out=tfplan.binary --terragrunt-working-dir "$stack"
            terraform -chdir="$stack" show -json tfplan.binary > "$stack/plan.json"
            conftest test "$stack/plan.json" --policy policies --data /tmp/policy-data --all-namespaces
          done

  apply:
    needs: [detect, policy-gate]
    runs-on: self-hosted
    environment: production # requires manual approval for prod stacks per GitHub Environments protection rules
    steps:
      - uses: actions/checkout@v4
      - name: terragrunt apply per changed stack, in layer order
        run: |
          for stack in $(echo '${{ needs.detect.outputs.stacks }}' | jq -r '.[]'); do
            echo "Applying $stack"
            terragrunt apply -auto-approve --terragrunt-working-dir "$stack"
          done
